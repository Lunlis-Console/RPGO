name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build Server
        run: dotnet build LostAndDivine.Server --no-restore -c Release
      - name: Build Client
        run: dotnet build LostAndDivine.ClientMonoGame --no-restore -c Release
      - name: Test
        run: dotnet test LostAndDivine.Tests --no-restore -c Release --logger "console;verbosity=detailed"
      - name: Verify DbBackups rotation (FileName)
        run: |
          echo "DbBackups rotation uses FileName ordering (P5) — see MigrationRunner.RotateBackups"
